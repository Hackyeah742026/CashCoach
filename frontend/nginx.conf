# Serves the built SPA and proxies /api to the backend container (see docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream as server-sent events: pass them through unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/chat, /goals, /wrapped/…) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
