# Runs the whole app locally: `docker compose up --build`, then open http://localhost:8080
services:
  backend:
    build: ./backend
    # GEMINI_API_KEY (and optional GEMINI_MODEL) come from the root .env. Without a key the app still
    # works: every AI feature falls back to deterministic templates.
    env_file:
      - path: .env
        required: false
    volumes:
      - cashcoach-data:/data   # SQLite database survives restarts
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_USE_MOCKS: "false"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cashcoach-data:
